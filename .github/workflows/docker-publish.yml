name: Publish to container registry

on:
  push:
    tags: [ '*.*.*' ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    strategy:
      matrix:
        include:
          - image: database
            context: ./database
            dockerfile: database/Dockerfile
          - image: backend
            context: .
            dockerfile: backend/Dockerfile
            target: production
          - image: client
            context: .
            dockerfile: client/Dockerfile
            target: production
          - image: installer
            context: ./installer
            dockerfile: installer/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cosign
        if: ${{ !env.ACT }}
        uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: 'v3.1.4'

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log into registry ${{ env.ACT == 'true' && format('registry.{0}', vars.HOSTNAME) || 'ghcr.io' }}
        if: ${{ !env.ACT }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.ACT == 'true' && format('registry.{0}', vars.HOSTNAME) || 'ghcr.io' }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.ACT == 'true' && format('registry.{0}', vars.HOSTNAME) || 'ghcr.io' }}/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ !env.ACT }}
          tags: ${{ steps.meta.outputs.tags }}
          target: ${{ matrix.target || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ !env.ACT }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: cosign sign --yes "${IMAGE}@${DIGEST}"


  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Create GitHub Release
        if: ${{ !env.ACT }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "${TAG}" -t "${TAG}" --generate-notes
    
  build-compose:
    needs: release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - filename: compose.yaml
            files: '["compose.yaml","compose.prod.yaml"]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Merge compose files
        env: 
          FILES: ${{ matrix.files }}
          OUTPUT_FILE: ${{ matrix.filename }}
        run: |
          args=()

          while IFS= read -r file; do
            args+=(-f "$file")
          done < <(jq -r '.[]' <<< "$FILES")

          docker compose \
            "${args[@]}" \
            config --no-interpolate --no-path-resolution \
            > temp_compose
          
          cat temp_compose > "$OUTPUT_FILE"

      - name: Verify merged compose file
        if: ${{ env.ACT }}
        run: cat ${{ matrix.filename }}

      - name: Upload Compose file to release
        if: ${{ !env.ACT }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "${TAG}" ${{ matrix.filename }}
