include:
  - compose.yaml

services:

  # Database

  db:
    build: ./database

  # Backend

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: development
    develop:
      watch:
        - path: ./backend
          action: sync+restart
          target: /app/backend
        - path: ./common
          action: rebuild
        - path: ./backend/package.json
          action: rebuild
        - path: ./backend/tsconfig.json
          action: rebuild
    environment:
      MODE: dev

  # Client

  client:
    build:
      context: .
      dockerfile: ./client/Dockerfile
      target: development
    develop:
      watch:
        - path: ./client
          action: sync
          target: /app/client
        - path: ./common
          action: rebuild
        - path: ./i18n
          action: sync
          target: /app/client/public/translations
        - path: ./client/package.json
          action: rebuild
    environment:
      MODE: dev
    volumes:
      - uploads:/app/client/public/uploads:ro
    labels:
      traefik.http.services.client.loadbalancer.server.port: 5173