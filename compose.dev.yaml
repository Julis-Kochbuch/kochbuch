services:

  # Proxy

  proxy:
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --entrypoints.web.address=:80
    ports:
      - 80:80
      - 8080:8080

  # Backend

  backend:
    build:
      context: ./backend
      target: development
    environment:
      MODE: dev

  # Client

  client:
    build:
      context: ./client
      target: development
    labels:
      traefik.http.services.client.loadbalancer.server.port: 5173

  # pgAdmin

  pgadmin:
    image: elestio/pgadmin:latest
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=login@pgadmin.org
      - PGADMIN_DEFAULT_PASSWORD=password
      - PGADMIN_LISTEN_PORT=5004
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    labels:
      traefik.http.routers.pgadmin.rule: Host(`db.${HOSTNAME:?}`)
      traefik.http.services.pgadmin.loadbalancer.server.port: 5004

volumes:
  pgadmin_data:
