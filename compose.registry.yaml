services:
  container-registry:
    image: registry:latest
    restart: unless-stopped
    volumes:
      - registry_data:/var/lib/registry
    labels:
      traefik.enable: true
      traefik.http.routers.container-registry.entrypoints: web
      traefik.http.routers.container-registry.rule: Host(`registry.${APP_HOSTNAME:?}`)
      traefik.http.services.container-registry.loadbalancer.server.port: 5000

volumes:
  registry_data: