services:
  proxy:
    image: traefik:v3.7
    restart: unless-stopped
    networks:
      - proxy
    command:
      - --providers.docker=true
      - --providers.docker.network=proxy
      - --providers.docker.exposedbydefault=false

      - --entrypoints.web.address=:80
    ports:
      - ${HTTP_PORT:-80}:80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  proxy:
    external: true