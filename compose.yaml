services:

  # Proxy

  proxy:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false

      - --entrypoints.web.address=:80
    ports:
      - ${HTTP_PORT:-80}:80
    depends_on:
      - client
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Database

  db:
    build: ./database
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_pw_admin
      POSTGRES_DB: kochbuch
    secrets:
      - pg_pw_admin
      - pg_pw_backend
      - kochbuch_pw_admin
    volumes:
      - postgres_data:/var/lib/postgresql

  # Session Store

  session-store:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # Backend

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: production
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: true
      DATABASE_HOST: db
      DATABASE_USER: backend-1
      DATABASE_DB: kochbuch
      SESSION_STORE_URL: redis://session-store:6379
      HOSTNAME: ${HOSTNAME:?}
      PORT: 5001
      HTTP_PROXY_PORT: ${HTTP_PORT-}
      HTTPS_PROXY_PORT: ${HTTPS_PORT-}
      MODE: dev
    secrets:
      - pg_pw_backend
      - session_secret
    volumes:
      - uploads:/app/uploads
    depends_on:
      - db
      - session-store
    labels:
      traefik.enable: true
      traefik.http.routers.backend.entrypoints: web
      traefik.http.routers.backend.rule: Host(`${HOSTNAME:?}`) && PathPrefix(`/api`)
      traefik.http.routers.backend.middlewares: "backend-stripprefix"
      traefik.http.middlewares.backend-stripprefix.stripprefix.prefixes: "/api"
      traefik.http.services.backend.loadbalancer.server.port: 5001

  # Client

  client:
    build:
      context: .
      dockerfile: ./client/Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      CHOKIDAR_USEPOLLING: true
      HOSTNAME: ${HOSTNAME:?}
      HTTP_PROXY_PORT: ${HTTP_PORT-}
      HTTPS_PROXY_PORT: ${HTTPS_PORT-}
      MODE: prod
    volumes:
      - uploads:/usr/share/nginx/html/uploads:ro
    labels:
      traefik.enable: true
      traefik.http.routers.client.entrypoints: web
      traefik.http.routers.client.rule: "Host(`${HOSTNAME:?}`)"
      traefik.http.services.client.loadbalancer.server.port: 80

secrets:
  pg_pw_admin:
    file: ./secrets/pg_pw_admin
  pg_pw_backend:
    file: ./secrets/pg_pw_backend
  kochbuch_pw_admin:
    file: ./secrets/kochbuch_pw_admin
  session_secret:
    file: ./secrets/session_secret

volumes:
  postgres_data:
  redis_data:
  uploads:
