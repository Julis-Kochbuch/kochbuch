services:

  # Database

  db:
    image: ghcr.io/julis-kochbuch/kochbuch-database:${TAG:?}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_pw_admin
      POSTGRES_DB: kochbuch
    networks:
      - internal
    secrets:
      - pg_pw_admin
      - pg_pw_backend
      - kochbuch_pw_admin
    volumes:
      - postgres_data:/var/lib/postgresql

  # Session Store

  session-store:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - redis_data:/data

  # Backend

  backend:
    image: ghcr.io/julis-kochbuch/kochbuch-backend:${TAG:?}
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: true
      POSTGRES_HOST: db
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_pw_backend
      POSTGRES_USER: backend-1
      POSTGRES_DB: kochbuch
      REDIS_URL: redis://session-store:6379
      APP_HOSTNAME: ${APP_HOSTNAME:?}
      HTTP_PROXY_PORT: ${HTTP_PORT-}
      HTTPS_PROXY_PORT: ${HTTPS_PORT-}
      SESSION_SECRET_FILE: /run/secrets/session_secret
      MODE: dev
    networks:
      - proxy
      - internal
    secrets:
      - pg_pw_backend
      - session_secret
    volumes:
      - uploads:/app/uploads
    depends_on:
      - db
      - session-store
    labels:
      traefik.enable: true
      traefik.http.routers.backend.entrypoints: web
      traefik.http.routers.backend.rule: Host(`${APP_HOSTNAME:?}`) && PathPrefix(`/api`)
      traefik.http.routers.backend.middlewares: "backend-stripprefix"
      traefik.http.middlewares.backend-stripprefix.stripprefix.prefixes: "/api"
      traefik.http.services.backend.loadbalancer.server.port: 5001

  # Client

  client:
    image: ghcr.io/julis-kochbuch/kochbuch-client:${TAG:?}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      CHOKIDAR_USEPOLLING: true
      APP_HOSTNAME: ${APP_HOSTNAME:?}
      HTTP_PROXY_PORT: ${HTTP_PORT-}
      HTTPS_PROXY_PORT: ${HTTPS_PORT-}
      MODE: prod
    networks:
      - proxy
    volumes:
      - uploads:/usr/share/nginx/html/uploads:ro
    labels:
      traefik.enable: true
      traefik.http.routers.client.entrypoints: web
      traefik.http.routers.client.rule: "Host(`${APP_HOSTNAME:?}`)"
      traefik.http.services.client.loadbalancer.server.port: 80

networks:
  proxy:
    external: true
  internal:
    internal: true

secrets:
  pg_pw_admin:
    file: ./secrets/pg_pw_admin
  pg_pw_backend:
    file: ./secrets/pg_pw_backend
  kochbuch_pw_admin:
    file: ./secrets/kochbuch_pw_admin
  session_secret:
    file: ./secrets/session_secret

volumes:
  postgres_data:
  redis_data:
  uploads: